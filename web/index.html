<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>XGames</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #182d3b; }
    #app { display: flex; width: 100%; height: 100%; }

    /* ── 侧边栏（纯 DOM，与游戏 iframe 物理隔离，永不遮挡游戏元素）── */
    #sidebar {
      flex: 0 0 70px; box-sizing: border-box; width: 70px;
      background: rgba(13, 27, 42, 0.95);
      border-right: 1px solid rgba(255, 213, 79, 0.3);
      display: flex; flex-direction: column; align-items: center;
      padding: 10px 0 8px; font-family: Arial, sans-serif; user-select: none;
      height: 100%;
    }
    #sidebar .title { font-size: 14px; color: #aac7ff; margin: 6px 0 8px; text-shadow: 0 0 2px #000; flex-shrink: 0; }
    /* 游戏列表滚动容器：固定高度，内部 overflow */
    #sidebar .game-list {
      flex: 1; width: 66px; overflow-y: auto; overflow-x: hidden;
      display: flex; flex-direction: column; align-items: center;
      padding: 2px 0; scrollbar-width: thin; scrollbar-color: #4a5568 transparent;
    }
    #sidebar .game-list::-webkit-scrollbar { width: 4px; }
    #sidebar .game-list::-webkit-scrollbar-track { background: transparent; }
    #sidebar .game-list::-webkit-scrollbar-thumb { background: #4a5568; border-radius: 2px; }
    #sidebar .game-item {
      width: 62px; height: 70px; margin: 4px 0; box-sizing: border-box;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      border-radius: 6px; position: relative; border: 1px solid rgba(85, 85, 85, 0.4);
      background: rgba(255, 255, 255, 0.08); flex-shrink: 0;
    }
    #sidebar .game-item .icon { font-size: 28px; line-height: 1; }
    #sidebar .game-item .label {
      font-size: 12px; margin-top: 6px; color: #888;
      text-shadow: 0 0 2px #000; cursor: default;
    }
    #sidebar .game-item.current {
      background: rgba(255, 213, 79, 0.25); border: 2px solid rgba(255, 213, 79, 0.9);
    }
    #sidebar .game-item.current .label { color: #ffe082; }
    #sidebar .spacer { flex: 0 0 auto; height: 6px; }
    /* 底部按钮区固定不滚动 */
    #sidebar .sidebar-btns { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; }
    #sidebar .sidebar-btn {
      width: 50px; height: 45px; margin-top: 8px; box-sizing: border-box;
      background: #2a2a3e; border: 2px solid #4a4a5e; border-radius: 6px;
      color: #fff; font-size: 22px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    #sidebar .sidebar-btn:hover { background: #3a3a4e; }
    #sidebar .browser-btn { /* 与设置按钮保持一致 */ }

    /* ── 游戏区域：iframe 独占剩余空间 ── */
    #frame-wrap { flex: 1; position: relative; min-width: 0; }
    #game-frame { width: 100%; height: 100%; border: 0; display: block; background: #182d3b; }
    #shell-toast {
      display: none; position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75); color: #ffd54f;
      padding: 8px 18px; border-radius: 6px; font: 16px Arial, sans-serif;
      z-index: 50; pointer-events: none; white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="app">
    <aside id="sidebar"></aside>
    <div id="frame-wrap">
      <iframe id="game-frame" name="game-frame"></iframe>
      <div id="shell-toast"></div>
    </div>
  </div>
  <script>
    // 直达路由支持：把外壳当前 hash 传给游戏 iframe（书签 / 直链初次加载时生效）。
    // 必须在 iframe 开始加载前同步设置，否则场景端拿不到初始 hash。
    document.getElementById('game-frame').src = './game.html' + (location.hash || '');
  </script>
  <script type="module" src="./src/shell.ts"></script>
</body>
</html>
