name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            artifact: "*.dmg"
          - os: ubuntu-22.04
            platform: linux
            artifact: "*.zip"
          - os: windows-latest
            platform: windows
            artifact: "*.zip"

    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            build-essential \
            pkg-config \
            libglib2.0-dev \
            libsoup-3.0-dev \
            javascriptcoregtk-4.0-dev \
            zip

      - name: Verify toolchain versions
        shell: bash
        run: |
          go version
          node --version
          npm --version

      - name: Build & Package
        shell: bash
        # 不在此处设置 CGO_*：macOS 兼容目标 (MACOSX_DEPLOYMENT_TARGET /
        # -mmacosx-version-min) 由 run_tools.sh 按当前平台自行导出。
        # 若写在这里会对三平台全部生效，而 -mmacosx-version-min 是 Apple clang
        # 专有选项，Linux 的 gcc / Windows 的 mingw 会直接编译失败。
        run: |
          chmod +x ./scripts/run_tools.sh
          ./scripts/run_tools.sh build

      - name: List artifacts
        shell: bash
        run: ls -lh release/

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: XGames ${{ github.ref_name }}
          body: |
            ## XGames ${{ github.ref_name }}

            Auto-built desktop app for macOS (universal DMG), Windows (amd64 ZIP), and Linux (amd64 ZIP).

            - **macOS 12+**: Double-click `.dmg` to install (兼容 macOS 12 Monterey 及以上)
            - **Windows 10+**: Extract `.zip` and run `XGames.exe`
            - **Linux (glibc 3.2+)**: Extract `.zip` and run `./XGames`
          files: release/${{ matrix.artifact }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
