name: Release XGames

# =============================================================================
# v* tag 触发，三平台并行构建，汇总发布到 GitHub Release。
#
# 全部构建相关逻辑集中在 ./scripts/run_tools.sh build（自动按当前 runner 平台分派）：
#   - 构建依赖准备：Linux apt 装 GTK3/WebKit2GTK + 生成 webkit2gtk-4.0.pc 兼容别名；
#     Windows 探测/安装 MinGW-w64（CGO）；macOS 校验 clang；并自动安装 Wails CLI
#   - 前端构建（Vite）+ 协议生成 + wails build + 打包：
#     macOS universal (amd64+arm64, min 12.0) → .app → .dmg（含 ad-hoc 签名）；
#     Linux / Windows → .zip
# 本 workflow 只做 runner 引导（checkout、Go/Node 工具链与缓存）与产物上传，不写任何
# 系统依赖 / CGO / wails / lipo / codesign / hdiutil / zip 细节，避免与本地行为漂移。
# =============================================================================

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS (universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # run_tools.sh 内部完成：校验 clang → 安装 Wails CLI → 生成协议 + 构建前端(Vite)
      # → wails build darwin/universal (min 12.0) → 生成 .app → 同步 config → hdiutil 生成 DMG
      - name: Build & package via run_tools.sh
        run: ./scripts/run_tools.sh build

      - name: List artifacts
        run: ls -lh release/

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: release/*.dmg

  build-linux:
    name: Linux (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # run_tools.sh 内部完成：apt 安装 GTK3/WebKit2GTK 并生成 webkit2gtk-4.0.pc 兼容别名
      # → 安装 Wails CLI → 构建前端 → wails build linux/amd64 → zip 打包
      - name: Build & package via run_tools.sh
        run: ./scripts/run_tools.sh build

      - name: List artifacts
        run: ls -lh release/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-zip
          path: release/*.zip

  build-windows:
    name: Windows (amd64)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # run_tools.sh 内部完成：探测/安装 MinGW-w64（CGO 所需 gcc）→ 安装 Wails CLI
      # → 构建前端 → wails build windows/amd64 → zip 打包
      - name: Build & package via run_tools.sh
        run: ./scripts/run_tools.sh build

      - name: List artifacts
        run: ls -lh release/

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: release/*.zip

  release:
    name: Create GitHub Release
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: List release assets
        run: ls -lhR release/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: XGames ${{ github.ref_name }}
          body: |
            ## XGames ${{ github.ref_name }}

            跨平台桌面游戏合集，基于 Go + Wails。
            构建逻辑由 `./scripts/run_tools.sh build` 统一实现。

            **下载说明:**
            - macOS: `XGames_v*.dmg` — universal (amd64 + arm64)，兼容 macOS 12 Monterey 及以上。未做 Apple 公证，首次打开如被 Gatekeeper 拦截，请右键应用选“打开”确认一次即可。
            - Linux: `XGames_v*_linux_amd64.zip` — 解压后运行 `./XGames`（需系统预装 `libwebkit2gtk-4.0`（或 4.1）与 `libgtk-3-0`；Ubuntu 22.04+/Debian 12+ 官方源均已提供）
            - Windows: `XGames_v*_windows_amd64.zip` — 解压后运行 `XGames.exe`（需系统预装 WebView2 Runtime，Win 10 1803+ 默认自带）
          files: |
            release/*.dmg
            release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
